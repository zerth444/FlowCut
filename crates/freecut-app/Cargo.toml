[package]
name = "freecut-app"
description = "FlowCut desktop application binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
# Бинарник называется FlowCut.exe — видимая марка приложения.
name = "FlowCut"
path = "src/main.rs"

[dependencies]
freecut-core = { path = "../freecut-core" }
freecut-ui = { path = "../freecut-ui" }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints]
workspace = true
