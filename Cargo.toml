[workspace]
resolver = "2"
members = [
    "crates/freecut-core",
    "crates/freecut-media",
    "crates/freecut-audio",
    "crates/freecut-ui",
    "crates/freecut-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
authors = ["FlowCut contributors"]

[workspace.lints.rust]
unsafe_code = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev.package."*"]
opt-level = 1
